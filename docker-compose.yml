version: "3.8"

services:
  ms-autenticacao:
    build: ./backend/ms-autenticacao
    ports:
      - "8081:8081"
    environment:
      - JWT_SECRET=0a1b2c3d4e5f60718293a4b5c6d7e8f90123456789abcdef0123456789abcdef0123456789abcdef0123456789ab
    networks:
      - backend
    restart: unless-stopped

  ms-financeiro:
    build: ./backend/ms-financeiro
    ports:
      - "8082:8082"
    networks:
      - backend
    restart: unless-stopped

  api-gateway:
    build: ./backend/api-gateway
    ports:
      - "8080:8080"
    environment:
      - MS_AUTENTICACAO_URL=http://ms-autenticacao:8081
      - MS_FINANCEIRO_URL=http://ms-financeiro:8082
      - JWT_SECRET=0a1b2c3d4e5f60718293a4b5c6d7e8f90123456789abcdef0123456789abcdef0123456789abcdef0123456789ab
    depends_on:
      - ms-autenticacao
      - ms-financeiro
    networks:
      - backend
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge
