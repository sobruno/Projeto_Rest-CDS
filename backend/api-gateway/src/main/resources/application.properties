server.port=8080
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Autenticacao
springdoc.swagger-ui.urls[0].url=/docs/autenticacao
springdoc.swagger-ui.urls[1].name=Financeiro
springdoc.swagger-ui.urls[1].url=/docs/financeiro
springdoc.swagger-ui.urls-primary-name=Autenticacao

# backend URLs
ms.autenticacao.url=http://localhost:8081
ms.financeiro.url=http://localhost:8082

# JWT secret must match ms-autenticacao
jwt.secret=${JWT_SECRET:0a1b2c3d4e5f60718293a4b5c6d7e8f90123456789abcdef0123456789abcdef0123456789abcdef0123456789ab}

# CORS allowed origins will be handled by front-end or via global config if needed
spring.application.name=api-gateway

# Gateway should not configure a datasource. Database access moved to backend services.
