server.port=8081
spring.datasource.url=jdbc:h2:mem:autenticacao;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Ensure JPA creates schema before running `data.sql`
spring.jpa.defer-datasource-initialization=true

# strong secret (64 bytes -> 512 bits) - can be overridden via env
jwt.secret=${JWT_SECRET:0a1b2c3d4e5f60718293a4b5c6d7e8f90123456789abcdef0123456789abcdef0123456789abcdef0123456789ab}
spring.application.name=ms-autenticacao
